<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏆%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>منصة القدرات والتحصيلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: navy school header, sticky gold-tab strip, then one working view at a time. Follows the school's own template. */
:root {
  --bg:#f0f5fb; --surface:#ffffff; --surface-2:#eef3f9; --line:#dde6f1;
  --fg:#1b3358; --fg-2:#526680; --fg-3:#6b7d95;
  --accent:#1f3d68; --gold-a:#e9c33a; --gold-b:#c9a227; --on-gold:#1b2a44;
  --head-a:#1b365d; --head-b:#2a4a7c; --on-head:#ffffff; --head-gold:#f4d35e; --head-chip:rgba(255,255,255,.12); --head-line:rgba(255,255,255,.22);
  --c1:#2563a8; --c2:#c2820a; --c3:#0f9a7f;
  --tile-a:#dbeafe; --tile-b:#fef3c7; --tile-c:#dcfce7; --tile-d:#f3e8ff; --tile-e:#fee2e2; --tile-f:#ccfbf1; --tile-g:#e0e7ff; --tile-h:#ffedd5;
  --danger:#b4232a; --danger-bg:#fdecec; --note-bg:#fff7da; --note-fg:#6d5206; --note-line:#efdc97;
  --medal-gold-a:#fbc531; --medal-gold-b:#eaae13; --on-medal-gold:#22304a;
  --medal-silver-a:#8fa0b8; --medal-silver-b:#5f7089; --on-medal-silver:#ffffff;
  --medal-bronze-a:#b5763a; --medal-bronze-b:#8a5220; --on-medal-bronze:#ffffff;
  --shadow:0 1px 2px rgba(27,54,93,.05),0 6px 20px rgba(27,54,93,.05);
  --display:"Cairo","Tajawal","Segoe UI",Tahoma,sans-serif; --body:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0f1a2c; --surface:#17263d; --surface-2:#1f3049; --line:#2c3f5c;
  --fg:#e8eef7; --fg-2:#b2c0d3; --fg-3:#93a4bb;
  --accent:#9cc3f0; --head-a:#14294a; --head-b:#1f3b66;
  --c1:#5592d8; --c2:#bd8916; --c3:#1fa98c;
  --tile-a:#1e3a5f; --tile-b:#4a3a12; --tile-c:#1b4332; --tile-d:#3b2a5a; --tile-e:#552a2d; --tile-f:#134e4a; --tile-g:#2b3567; --tile-h:#54351a;
  --danger:#ff9a9a; --danger-bg:#4a2024; --note-bg:#3b3113; --note-fg:#f3dc92; --note-line:#5e4e1c;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark;
} }
:root[data-theme="dark"] {
  --bg:#0f1a2c; --surface:#17263d; --surface-2:#1f3049; --line:#2c3f5c;
  --fg:#e8eef7; --fg-2:#b2c0d3; --fg-3:#93a4bb;
  --accent:#9cc3f0; --head-a:#14294a; --head-b:#1f3b66;
  --c1:#5592d8; --c2:#bd8916; --c3:#1fa98c;
  --tile-a:#1e3a5f; --tile-b:#4a3a12; --tile-c:#1b4332; --tile-d:#3b2a5a; --tile-e:#552a2d; --tile-f:#134e4a; --tile-g:#2b3567; --tile-h:#54351a;
  --danger:#ff9a9a; --danger-bg:#4a2024; --note-bg:#3b3113; --note-fg:#f3dc92; --note-line:#5e4e1c;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark;
}
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.55; font-variant-numeric:tabular-nums; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface); }
h1,h2,h3 { font-family:var(--display); margin:0; text-wrap:balance; line-height:1.3; }
p { margin:0; }
button,input,select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:3px solid var(--gold-b); outline-offset:2px; }
.wrap { max-width:1120px; margin-inline:auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }

/* header */
.head { background:linear-gradient(115deg,var(--head-a),var(--head-b)); color:var(--on-head); }
.head .wrap { display:flex; flex-wrap:wrap; align-items:center; gap:12px 14px; padding-block:18px; }
.cap { width:52px; height:52px; flex:none; display:grid; place-items:center; font-size:27px; border-radius:14px; background:var(--head-chip); border:1px solid var(--head-line); }
.brand { flex:1 1 220px; min-width:0; }
.brand h1 { font-size:clamp(19px,3.2vw,26px); font-weight:800; }
.brand p { color:var(--head-gold); font-size:15px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; align-items:stretch; }
.chip { padding:6px 14px; border-radius:12px; background:var(--head-chip); border:1px solid var(--head-line); text-align:center; font-size:13px; line-height:1.4; }
.chip b { display:block; font-family:var(--display); font-size:15px; color:var(--head-gold); }
.gear { width:48px; min-height:48px; border-radius:12px; background:var(--head-chip); border:1px solid var(--head-line); font-size:21px; color:var(--on-head); }

/* tabs */
.tabs { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line); box-shadow:var(--shadow); }
.tabs .wrap { display:flex; gap:8px; padding-block:10px; overflow-x:auto; scrollbar-width:none; }
.tab { flex:none; padding:9px 16px; border:0; border-radius:12px; background:var(--surface-2); font-weight:500; white-space:nowrap; }
.tab[aria-current="page"] { background:linear-gradient(120deg,var(--gold-b),var(--gold-a)); color:var(--on-gold); font-weight:700; }

/* general */
main.wrap { padding-block:22px 56px; display:grid; gap:22px; }
#view { display:grid; gap:22px; min-width:0; }
.banner { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; justify-content:space-between; padding:12px 16px; border-radius:12px; background:var(--note-bg); color:var(--note-fg); border:1px solid var(--note-line); font-size:15px; }
.page-head { display:flex; flex-wrap:wrap; align-items:center; gap:12px; justify-content:space-between; }
.page-head > div:first-child { display:flex; align-items:center; gap:12px; min-width:0; }
.page-head h2 { font-size:clamp(21px,3vw,27px); font-weight:800; }
.page-head p { color:var(--fg-2); font-size:14.5px; }
.ico { width:46px; height:46px; flex:none; display:grid; place-items:center; font-size:24px; border-radius:13px; background:var(--tile-b); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:8px 18px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:700; }
a.btn { color:inherit; text-decoration:none; }
.btn:hover { background:var(--surface-2); }
.btn.gold { border:0; background:linear-gradient(120deg,var(--gold-b),var(--gold-a)); color:var(--on-gold); }
.btn.gold:hover { filter:brightness(1.05); }
.btn.small { min-height:36px; padding:4px 12px; font-size:14px; font-weight:500; }
.btn.danger { color:var(--danger); }
.btn.danger.solid { background:var(--danger-bg); border-color:var(--danger); }
.btn[disabled] { opacity:.6; cursor:default; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:var(--shadow); min-width:0; display:grid; gap:16px; align-content:start; }
.panel > h3 { font-size:18px; font-weight:700; }
.panel-head { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
.panel-head h3 { font-size:18px; font-weight:700; }
.link { background:none; border:0; padding:0; color:var(--accent); font-weight:700; text-decoration:underline; text-underline-offset:3px; }
.muted { color:var(--fg-2); font-size:14.5px; }
.two { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr)); gap:22px; }

/* KPI cards */
.kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
.kpi { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 10px; text-align:center; display:grid; justify-items:center; gap:6px; box-shadow:var(--shadow); align-content:start; }
.tile { width:50px; height:50px; display:grid; place-items:center; border-radius:14px; font-size:25px; }
.kpi b { font-family:var(--display); font-size:27px; line-height:1.2; font-weight:800; }
.kpi span { color:var(--fg-2); font-size:14px; line-height:1.35; }
@media (max-width:760px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } }

/* horizontal bars */
.bars { display:grid; gap:14px; }
.bar-row { display:grid; gap:5px; }
.bar-top { display:flex; justify-content:space-between; gap:12px; font-size:15px; }
.bar-top b { font-weight:700; }
.track { height:12px; border-radius:6px; background:var(--surface-2); overflow:hidden; }
.fill { height:100%; border-radius:6px; min-width:4px; }
.c-qudrat { background:var(--c1); } .c-tahsili { background:var(--c2); } .c-step { background:var(--c3); } .c-one { background:var(--c1); }

/* columns */
.legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:14px; color:var(--fg-2); }
.legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-inline-end:6px; vertical-align:-1px; }
.cols-scroll { overflow-x:auto; }
.cols { display:grid; gap:10px; align-items:end; border-bottom:1px solid var(--line); }
.col { display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:2px; height:210px; }
.col > em { font-style:normal; font-weight:700; font-size:14px; margin-bottom:3px; }
.seg { width:min(64%,54px); }
.seg.top { border-radius:4px 4px 0 0; }
.col-labels { display:grid; gap:10px; margin-top:6px; font-size:13.5px; color:var(--fg-2); text-align:center; line-height:1.25; }
.months { min-width:620px; }

/* tables */
.tbl-wrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:15px; }
th,td { padding:9px 10px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap; }
th { color:var(--fg-2); font-weight:500; font-size:14px; }
th:first-child,td:first-child { text-align:right; }
tbody tr:last-child td { border-bottom:0; }

/* filters */
.filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.seg-ctl { display:flex; flex-wrap:wrap; gap:6px; }
.seg-ctl button { min-height:40px; padding:6px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); }
.seg-ctl button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--surface); font-weight:700; }
.sel { min-height:40px; padding:6px 10px; border-radius:10px; border:1px solid var(--line); background:var(--surface); max-width:100%; }

/* activity list */
.acts { display:grid; }
.act { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 16px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center; }
.act:last-child { border-bottom:0; }
.act h4 { margin:0; font-family:var(--display); font-size:16px; font-weight:700; }
.act .meta { color:var(--fg-2); font-size:14px; }
.pills { display:flex; flex-wrap:wrap; gap:6px; margin-block:5px; }
.pill { display:inline-block; padding:1px 10px; border-radius:99px; background:var(--surface-2); font-size:13.5px; }
.act-side { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end; }
.count { font-size:14px; color:var(--fg-2); white-space:nowrap; }
.count b { color:var(--fg); font-family:var(--display); }
@media (max-width:620px) { .act { grid-template-columns:minmax(0,1fr); } .act-side { justify-content:flex-start; } }

/* awards */
.podium { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:start; }
.medal-card { border-radius:22px; padding:18px 14px 22px; text-align:center; display:grid; justify-items:center; gap:4px; box-shadow:var(--shadow); }
.medal-card .m { font-size:52px; line-height:1.15; }
.medal-card .av { width:96px; height:96px; border-radius:50%; display:grid; place-items:center; font-size:46px; background:rgba(255,255,255,.34); margin-block:6px; }
.medal-card h3 { font-size:22px; font-weight:800; }
.medal-card .pts { font-size:16px; font-weight:700; }
.medal-card .sub { font-size:14px; }
.r1 { background:linear-gradient(160deg,var(--medal-gold-a),var(--medal-gold-b)); color:var(--on-medal-gold); }
.r2 { background:linear-gradient(160deg,var(--medal-silver-a),var(--medal-silver-b)); color:var(--on-medal-silver); }
.r3 { background:linear-gradient(160deg,var(--medal-bronze-a),var(--medal-bronze-b)); color:var(--on-medal-bronze); }
@media (max-width:760px) { .podium { grid-template-columns:minmax(0,1fr); } }
.leads { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
@media (max-width:980px) { .leads { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.lead { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:grid; gap:2px; box-shadow:var(--shadow); text-align:right; width:100%; }
.lead small { color:var(--fg-2); font-size:14px; }
.lead b { font-family:var(--display); font-size:18px; }
.lead span { color:var(--fg-2); font-size:14px; }
@media (max-width:520px) { .leads { grid-template-columns:minmax(0,1fr); } }
.rank-list { display:grid; }
.rank { display:grid; grid-template-columns:38px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
.rank:last-child { border-bottom:0; }
.rank .no { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:var(--surface-2); font-weight:700; font-family:var(--display); }
.rank .track { height:7px; margin-top:4px; }
.names { display:flex; flex-wrap:wrap; gap:6px; }

.empty { text-align:center; padding:34px 18px; display:grid; gap:12px; justify-items:center; }
.empty .big { font-size:44px; line-height:1; }
.empty h3 { font-size:20px; font-weight:700; }
.empty p { max-width:50ch; color:var(--fg-2); }
.empty .row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }

/* dialogs */
dialog { width:min(560px,calc(100vw - 32px)); max-height:calc(100dvh - 32px); border:1px solid var(--line); border-radius:20px; padding:0; background:var(--surface); color:var(--fg); overflow:auto; }
dialog::backdrop { background:rgba(10,22,40,.55); }
.form { display:grid; gap:16px; padding:20px; }
.form h2 { font-size:21px; font-weight:800; }
.field { display:grid; gap:6px; border:0; padding:0; margin:0; min-width:0; }
.field > label,.field > legend { font-weight:700; font-size:15px; padding:0; }
.field input[type=text],.field input[type=url],.field input[type=number],.field input[type=date],.field select { width:100%; min-height:46px; padding:8px 12px; border-radius:11px; border:1px solid var(--line); background:var(--bg); }
.hint { font-size:14px; color:var(--fg-2); min-height:1.4em; }
.err { color:var(--danger); font-size:14.5px; font-weight:500; }
.radios { display:flex; flex-wrap:wrap; gap:8px; }
.radios label { display:flex; align-items:center; gap:7px; min-height:44px; padding:6px 14px; border-radius:11px; border:1px solid var(--line); background:var(--bg); cursor:pointer; }
.radios label:has(input:checked) { border-color:var(--gold-b); box-shadow:inset 0 0 0 1px var(--gold-b); font-weight:700; }
.form-actions { display:flex; flex-wrap:wrap; gap:10px; }
.toast { position:fixed; inset-inline:0; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:30; display:flex; justify-content:center; pointer-events:none; padding-inline:16px; }
.toast div { background:var(--fg); color:var(--bg); padding:9px 18px; border-radius:12px; font-weight:500; }
.tip { position:fixed; z-index:40; pointer-events:none; background:var(--fg); color:var(--bg); padding:5px 10px; border-radius:8px; font-size:14px; max-width:240px; }
.award-cta { flex:0 1 auto; display:flex; align-items:center; gap:14px; min-width:0; padding:10px 20px; border:0; border-radius:18px; background:linear-gradient(120deg,var(--medal-gold-b),var(--medal-gold-a)); color:var(--on-medal-gold); text-align:right; box-shadow:0 4px 16px rgba(0,0,0,.22); }
.award-cta:hover { filter:brightness(1.05); }
.award-cta[aria-current="page"] { box-shadow:0 0 0 3px var(--on-head); }
.award-cta .tr { font-size:60px; line-height:1; flex:none; }
.award-cta .tx { min-width:0; }
.award-cta b { display:block; font-family:var(--display); font-size:clamp(26px,3vw,33px); font-weight:800; line-height:1.2; }
.award-cta small { display:block; font-size:14.5px; font-weight:500; }
@media (max-width:760px) { .award-cta { flex:1 1 100%; justify-content:center; } .brand { flex:1 1 calc(100% - 70px); } .chips { flex:1 1 0; min-width:0; } .chip { flex:1 1 auto; min-width:0; } }
.badges { display:flex; flex-wrap:wrap; gap:5px; }
.medal-card .badges { justify-content:center; margin-top:4px; }
.badge { padding:1px 9px; border-radius:99px; font-size:13px; background:var(--surface-2); }
.badge.off { opacity:.6; filter:grayscale(1); }
.medal-card .badge { background:rgba(255,255,255,.28); }
.medal-card .tools { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; }
.medal-card .btn { background:rgba(255,255,255,.22); border-color:currentColor; color:inherit; }
.medal-card .btn:hover { background:rgba(255,255,255,.36); }
.name-btn { background:none; border:0; padding:0; font-weight:700; text-align:right; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:4px; }
.rank .badges { display:inline-flex; margin-inline-start:6px; font-size:14px; gap:2px; }
.hint-line { font-size:13.5px; color:var(--fg-2); margin-top:3px; }
.check { display:inline-flex; align-items:center; gap:7px; min-height:40px; cursor:pointer; }
.actions { display:flex; flex-wrap:wrap; gap:8px; }
.lead.star { border-color:var(--gold-b); box-shadow:inset 0 0 0 1px var(--gold-b); }
.t-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.t-stats div { background:var(--surface-2); border-radius:12px; padding:8px; text-align:center; font-size:13.5px; color:var(--fg-2); }
.t-stats b { display:block; font-family:var(--display); font-size:21px; color:var(--fg); }
#certImg { display:block; width:100%; border-radius:8px; border:1px solid var(--line); }
#msgText { width:100%; min-height:190px; padding:10px; border-radius:11px; border:1px solid var(--line); background:var(--bg); }
@media (prefers-reduced-motion: no-preference) { .fill,.seg { transition:height .25s,width .25s; } }
</style>

</head>
<body>
<div dir="rtl" lang="ar">
<header class="head"><div class="wrap">
  <div class="cap" aria-hidden="true">🎓</div>
  <div class="brand"><h1 id="school"></h1><p id="principal"></p></div>
  <div class="chips" id="dateChips"></div>
  <button class="gear" id="gearBtn" type="button" aria-label="إعدادات المدرسة" title="إعدادات المدرسة" data-act="settings">⚙️</button>
  <button class="award-cta" id="awardCard" type="button" data-route="awards"></button>
</div></header>
<nav class="tabs" aria-label="صفحات المنصة"><div class="wrap" id="tabs"></div></nav>
<main class="wrap"><div id="banners"></div><div id="view"></div></main>

<dialog id="formDlg" aria-labelledby="formTitle">
  <form id="actForm" class="form" novalidate>
    <h2 id="formTitle">إضافة نشاط</h2>
    <fieldset class="field"><legend id="trackLegend">النشاط</legend><div class="radios" id="trackRadios"></div></fieldset>
    <div class="field"><label for="fType">نوع النشاط</label>
      <select id="fType"></select>
      <input id="fTypeOther" type="text" placeholder="اكتب نوع النشاط" aria-label="نوع النشاط الآخر" maxlength="80" hidden>
    </div>
    <div class="field"><label for="fDate">اليوم والتاريخ</label>
      <input id="fDate" type="date">
      <div class="hint" id="fDateHint" aria-live="polite"></div>
    </div>
    <div class="field"><label for="fTeacher">اسم المعلمة</label>
      <select id="fTeacher"></select>

</div></dialog>

  <h2 id="msgTitle">رسالة التكريم</h2>
  <p class="muted">تعذر النسخ التلقائي. حدّد النص وانسخه يدويًا.</p>
  <textarea id="msgText" readonly aria-label="نص رسالة التكريم"></textarea>

</div></dialog>
<div class="toast" id="toast" role="status" hidden><div></div></div>
<div class="tip" id="tip" hidden></div>
</div>

<script>
"use strict";
document.documentElement.lang = "ar"; document.documentElement.dir = "rtl";
const TEACHERS = ["منى السيد","أماني قاضي","أمل العطوة","نبيلة المغاسي","سرى الحازمي","حنان الشريف","أمل المحمدي","أفنان المهدي","دلال الحري","منال عشكان","سميرة الصبحي","حنان التميمي","عبير الدرادي","نجلاء المحمدي","نوال الجهني","منير الجهني","رحاب المري","صيطة الشريوني","ليلى الرحيلي","ابتسام الأحمري"];
const PROGRAMS = {
  qudrat:{name:"قدرات",emoji:"🎯",tile:"--tile-e",trackLabel:"النشاط",tracks:["كمي","لفظي"]},
  tahsili:{name:"تحصيلي",emoji:"📚",tile:"--tile-c",trackLabel:"المادة",tracks:["رياضيات","أحياء","كيمياء","فيزياء"]},
  step:{name:"ستيب",emoji:"🌐",tile:"--tile-a",trackLabel:"المهارة",tracks:["قراءة","استماع","قواعد","كتابة"]},
};
const PK = Object.keys(PROGRAMS);
const TYPES = ["حقيبة تدريبية","اختبار إلكتروني","ورشة عمل","إذاعة مدرسية","منصة مدرستي","حصة دراسية"];
const OTHER = "__other";
const YEARS = [1447,1448,1449,1450];
const HM = ["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
const GM = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const WD = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const ROUTES = [["home","📊 الرئيسية"],["qudrat","🎯 قدرات"],["tahsili","📚 تحصيلي"],["step","🌐 ستيب"],["analytics","📈 التحليلات"],["awards","🏆 لوحة التكريم"]];
const DEFAULT_SETTINGS = {school:"الثانوية الثامنة والثلاثون",principal:"أ. حنان مصلح الحربي",termStart:"2026-11-01",weeks:16};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- dates ---------- */
const ISO = /^\d{4}-\d{2}-\d{2}$/;
const hFmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{timeZone:"UTC",year:"numeric",month:"numeric",day:"numeric"});
const hCache = new Map();
function hijri(iso) {
  if (hCache.has(iso)) return hCache.get(iso);
  const p = hFmt.formatToParts(new Date(iso + "T12:00:00Z"));
  const g = t => parseInt(p.find(x => x.type === t).value, 10);
  const r = {y:g("year"),m:g("month"),d:g("day")};
  hCache.set(iso, r);
  return r;
}
const validIso = s => ISO.test(s || "") && !isNaN(new Date(s + "T12:00:00Z"));
const weekday = iso => WD[new Date(iso + "T12:00:00Z").getUTCDay()];
const hijriText = iso => { const h = hijri(iso); return `${h.d} ${HM[h.m-1]} ${h.y} هـ`; };
const gregText = iso => { const d = new Date(iso + "T12:00:00Z"); return `${d.getUTCDate()} ${GM[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
function todayIso() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const curYear = () => { const y = hijri(todayIso()).y; return YEARS.includes(y) ? y : YEARS[0]; };

/* ---------- wording ---------- */
function shares(n) { if (n === 1) return "مشاركة واحدة"; if (n === 2) return "مشاركتان"; return n <= 10 && n >= 3 ? `${n} مشاركات` : `${n} مشاركة`; }
function girls(n) { if (n === 1) return "طالبة واحدة"; if (n === 2) return "طالبتان"; return n <= 10 && n >= 3 ? `${n} طالبات` : `${n} طالبة`; }
const pct = (a,b) => b ? Math.round(a / b * 100) : 0;

/* ---------- names: match the same teacher across spelling variants ---------- */
const nameKey = s => String(s || "").trim().replace(/\s+/g," ").replace(/[ً-ْ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
const ROSTER = new Map(TEACHERS.map(t => [nameKey(t), t]));

/* ---------- state ---------- */
const S = {
  route:"home", loaded:false, canWrite:true, failed:false, noDb:false,
  activities:[], settings:{...DEFAULT_SETTINGS}, demo:false, confirm:null, limit:30,
  pYear:"all", pTrack:"all", aYear:"all", aProg:"all", wYear:curYear(), wProg:"all", wMonth:"all", wEvid:false,
  editing:null, formProg:"qudrat", dupOk:null, cert:null,
};
const clean = (id,d) => {
  const date = validIso(d.date) ? d.date : null;
  if (!date || !PROGRAMS[d.program]) return null;
  const h = hijri(date);
  const teacher = String(d.teacher || "").trim() || "غير محدد";
  return {id, program:d.program, track:String(d.track||""), type:String(d.type||""), date, teacher,
    students:Math.max(0,Number(d.students)||0), link:String(d.link||""), createdAt:Number(d.createdAt)||0, hy:h.y, hm:h.m, key:nameKey(teacher)};
};
const all = () => S.demo ? demoData() : S.activities;
const safeLink = u => { try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; } catch { return null; } };
const hasLink = a => !!safeLink(a.link);

/* ---------- ranking: most participations, ties broken by students reached ---------- */
function board(list) {
  const m = new Map();
  for (const a of list) {
    let t = m.get(a.key);
    if (!t) { t = {key:a.key,name:ROSTER.get(a.key)||a.teacher,count:0,students:0,evidence:0,p:{qudrat:0,tahsili:0,step:0}}; m.set(a.key,t); }
    t.count++; t.students += a.students; t.p[a.program]++; if (hasLink(a)) t.evidence++;
  }
  const r = [...m.values()].sort((a,b) => b.count-a.count || b.students-a.students || a.name.localeCompare(b.name,"ar"));
  r.forEach((t,i) => { const p = r[i-1]; t.rank = p && p.count===t.count && p.students===t.students ? p.rank : i+1; });
  r.forEach(t => { t.tied = r.filter(o => o.rank===t.rank).length > 1; });
  return r;
}
const inYear = (a,y) => y==="all" || a.hy===Number(y);
function teacherOptions() {
  const m = new Map(ROSTER);
  for (const a of S.activities) if (!m.has(a.key)) m.set(a.key,a.teacher);
  return [...m.values()];
}

/* ---------- example data: built in memory for preview, never stored ---------- */
let demoCache = null;
function demoData() {
  if (demoCache) return demoCache;
  let seed = 1448; const rnd = n => { seed = (seed*16807)%2147483647; return seed%n; };
  const start = Date.UTC(2025,7,24), span = 440; const out = [];
  for (let i=0;i<150;i++) {
    const program = PK[[0,0,0,1,1,2][rnd(6)]], tr = PROGRAMS[program].tracks;
    const idx = Math.min(rnd(TEACHERS.length),rnd(TEACHERS.length));
    const iso = new Date(start + rnd(span)*864e5).toISOString().slice(0,10);
    out.push(clean("demo"+i,{program,track:tr[rnd(tr.length)],type:TYPES[rnd(TYPES.length)],date:iso,teacher:TEACHERS[idx],students:12+rnd(29),link:rnd(5)?"https://example.com/":"",createdAt:i}));
  }
  return demoCache = out;
}

/* ---------- storage: Neon database through /api/awards ---------- */
const API = "/api/awards";
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
async function api(body) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(),15000);
  let res, json;
  try {
    res = await fetch(API + (body ? "" : "?t=" + Date.now()), body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctl.signal} : {cache:"no-store",signal:ctl.signal});
    json = await res.json();
  } catch { throw {code:"unavailable"}; }
  finally { clearTimeout(timer); }
  if (!res.ok || !json.ok) throw {code:json.code||"unavailable",detail:json.detail};
  return json;
}
const store = {
  async save(id,doc) {
    const r = await api({op:"save",id,data:doc});
    const row = clean(id,r.data);
    S.activities = S.activities.filter(a => a.id!==id).concat(row);
    lastData = null; render();
  },
  async remove(id) {
    await api({op:"delete",id});
    S.activities = S.activities.filter(a => a.id!==id);
    lastData = null; render();
  },
  async saveSettings(doc) { const r = await api({op:"settings",data:doc}); S.settings = {...DEFAULT_SETTINGS,...r.data}; lastData = null; render(); },
};
let lastData = null;
async function refresh() {
  try {
    const r = await api();
    const raw = JSON.stringify([r.activities,r.settings]);
    S.failed = false; S.noDb = false;
    const first = !S.loaded; S.loaded = true;
    if (raw!==lastData) {
      lastData = raw;
      S.activities = r.activities.map(x => clean(x.id,x.data)).filter(Boolean);
      if (r.settings) S.settings = {...DEFAULT_SETTINGS,...r.settings};
      render();
    } else if (first) render(); else renderBanners();
  } catch (e) {
    S.loaded = true; S.failed = true; S.noDb = e.code==="no_database"; render();
  }
}
/* Direct browser download (a static site has no viewer in the way). */
S.dl = {save: async ({filename,data}) => {
  const u = URL.createObjectURL(data instanceof Blob ? data : new Blob([data],{type:"text/csv;charset=utf-8"}));
  const l = document.createElement("a"); l.href = u; l.download = (filename.endsWith(".png") ? "certificate-" : filename.includes("ترتيب") ? "teachers-ranking-" : "activities-log-") + todayIso() + filename.slice(filename.lastIndexOf("."));
  document.body.appendChild(l); l.click(); l.remove();
  setTimeout(() => URL.revokeObjectURL(u),5000);
}};
function init() {
  const q = new URLSearchParams(location.search);
  if (q.get("view")==="1") { S.canWrite = false; $("gearBtn").hidden = true; }
  if (q.get("demo")==="1") S.demo = true;
  render(); refresh();
  setInterval(() => { if (!document.hidden && !$("formDlg").open && !$("setDlg").open) refresh(); },30000);
  document.addEventListener("visibilitychange",() => { if (!document.hidden) refresh(); });
}

/* ---------- shell ---------- */
function renderShell() {
  const st = S.settings;
  $("school").textContent = st.school || "منصة القدرات والتحصيلي وستيب";
  $("principal").textContent = st.principal ? "المديرة: " + st.principal : "";
  const iso = todayIso();
  let week = "";
  if (validIso(st.termStart)) {
    const n = Math.floor((new Date(iso+"T12:00:00Z") - new Date(st.termStart+"T12:00:00Z")) / (7*864e5)) + 1;
    const w = Number(st.weeks)||0;
    if (n>=1 && n<=w) week = `<small>الأسبوع ${n} من ${w}</small>`;
  }
  $("dateChips").innerHTML =
    `<div class="chip"><b>${esc(hijriText(iso))}</b>${esc(gregText(iso))}</div><div class="chip"><b>${esc(weekday(iso))}</b>${week}</div>`;
  const leader = board(all().filter(a => a.hy===curYear()))[0];
  $("awardCard").innerHTML = `<span class="tr" aria-hidden="true">🏆</span><span class="tx"><b>لوحة التكريم</b><small>${leader?`🥇 ${esc(leader.name)} · ${shares(leader.count)}`:"بانتظار أول مشاركة"}</small></span>`;
  if (S.route==="awards") $("awardCard").setAttribute("aria-current","page"); else $("awardCard").removeAttribute("aria-current");
  $("tabs").innerHTML = ROUTES.filter(x => x[0]!=="awards").map(([k,l]) =>`<button class="tab" type="button" data-route="${k}"${S.route===k?' aria-current="page"':""}>${l}</button>`).join("");
}
function renderBanners() {
  const b = [];
  if (S.demo) b.push(`<div class="banner"><span><b>أمثلة للمعاينة فقط.</b> هذه الأرقام غير حقيقية ولا تُحفظ.</span></div>`);
  if (S.failed) b.push(`<div class="banner"><span>${S.noDb?"قاعدة البيانات غير مربوطة بالموقع.":"تعذر الوصول إلى البيانات الآن، وقد لا تكون الأرقام محدّثة. تتم المحاولة تلقائيًا."}</span></div>`);
  $("banners").innerHTML = b.join("");
  $("banners").style.cssText = b.length ? "display:grid;gap:10px" : "display:none";
}
const canAdd = () => S.canWrite;
const addBtn = (p,label="➕ إضافة نشاط") => canAdd() ? `<button class="btn gold" type="button" data-act="add" data-prog="${p}">${label}</button>` : "";
const pageHead = (emoji,title,sub,tile,right="") => `<div class="page-head"><div><div class="ico" style="background:var(${tile})" aria-hidden="true">${emoji}</div><div><h2>${title}</h2><p>${sub}</p></div></div>${right}</div>`;
const segCtl = (name,val,opts) => `<div class="seg-ctl" role="group">${opts.map(([v,l]) => `<button type="button" id="seg-${name}-${v}" data-set="${name}" data-val="${v}" aria-pressed="${String(val)===String(v)}">${l}</button>`).join("")}</div>`;
const yearOpts = () => [["all","كل الأعوام"],...YEARS.map(y => [y,String(y)+" هـ"])];
const progOpts = (allLabel) => [["all",allLabel],...PK.map(k => [k,PROGRAMS[k].name])];
const barRow = (label,value,total,cls="c-one") => {
  const w = total ? value/total*100 : 0;
  return `<div class="bar-row" data-tip="${esc(label)}: ${value}"><div class="bar-top"><span>${esc(label)}</span><b>${value}</b></div><div class="track"><div class="fill ${cls}" style="width:${w}%${value?"":";min-width:0"}"></div></div></div>`;
};
const kpi = (emoji,tile,value,label) => `<div class="kpi"><div class="tile" style="background:var(${tile})" aria-hidden="true">${emoji}</div><b>${esc(value)}</b><span>${esc(label)}</span></div>`;

/* ---------- views ---------- */
/* The live site has no preview button. Examples open only through the ?demo=1 link, and only while nothing is stored. */
const demoBtn = () => "";
function loadingView() { return `<div class="panel empty"><div class="big" aria-hidden="true">⏳</div><h3>جارٍ تحميل الأنشطة</h3></div>`; }
function emptyView(title,text,showAdd=true) {
  const adds = showAdd && canAdd() ? PK.map(k => `<button class="btn gold" type="button" data-act="add" data-prog="${k}">➕ نشاط ${PROGRAMS[k].name}</button>`).join("") : "";
  return `<div class="panel empty"><div class="big" aria-hidden="true">📝</div><h3>${title}</h3><p>${text}</p><div class="row">${adds}${demoBtn()}</div></div>`;
}
function viewHome() {
  const list = all(); const b = board(list);
  const roster = new Set(ROSTER.keys()); list.forEach(a => roster.add(a.key));
  const count = t => list.filter(a => a.type===t).length;
  const byProg = PK.map(k => [k,list.filter(a => a.program===k).length]);
  const best = list.length ? PROGRAMS[[...byProg].sort((x,y) => y[1]-x[1])[0][0]].name : "—";
  const cards = [
    kpi("🗂️","--tile-g",list.length,"إجمالي الأنشطة"),
    kpi("👩‍🏫","--tile-a",b.length,"المعلمات المشاركات"),
    kpi("👧","--tile-h",list.reduce((s,a) => s+a.students,0),"الطالبات المستفيدات"),
    kpi("📦","--tile-b",count("حقيبة تدريبية"),"الحقائب التدريبية"),
    kpi("📝","--tile-c",count("اختبار إلكتروني"),"الاختبارات الإلكترونية"),
    kpi("🖼️","--tile-d",list.filter(hasLink).length,"الشواهد المرفوعة"),
    kpi("✅","--tile-e",pct(b.length,roster.size)+"%","نسبة مشاركة المعلمات"),
    kpi("🏆","--tile-f",best,"أكثر برنامج نشاطًا"),
  ].join("");
  let body;
  if (!list.length) body = emptyView("لم تُسجل أنشطة بعد","تظهر الإحصائيات ومراكز المعلمات هنا تلقائيًا بعد إضافة أول نشاط.");
  else {
    const recent = [...list].sort((a,b) => b.date.localeCompare(a.date) || b.createdAt-a.createdAt).slice(0,5);
    body = `<div class="two">
      <section class="panel"><h3>📊 توزيع الأنشطة حسب البرنامج</h3><div class="bars">${byProg.map(([k,v]) => {
        const w = pct(v,list.length);
        return `<div class="bar-row" data-tip="${PROGRAMS[k].name}: ${v}"><div class="bar-top"><span>${PROGRAMS[k].name}</span><b>${w}% · ${v}</b></div><div class="track"><div class="fill c-${k}" style="width:${w}%"></div></div></div>`;
      }).join("")}</div></section>
      <section class="panel"><div class="panel-head"><h3>🏆 الأولى في كل برنامج</h3><button class="link" type="button" data-route="awards">لوحة التكريم</button></div>
        <div class="rank-list">${PK.map(k => {
          const t = board(list.filter(a => a.program===k))[0];
          return `<div class="rank"><div class="no" aria-hidden="true">${PROGRAMS[k].emoji}</div><div><b>${esc(t?t.name:"لا توجد مشاركات")}</b><div class="muted">${PROGRAMS[k].name}</div></div><span class="count">${t?shares(t.count):""}</span></div>`;
        }).join("")}</div></section></div>
      <section class="panel"><h3>🕘 آخر الأنشطة</h3><div class="acts">${recent.map(a => actRow(a,true)).join("")}</div></section>`;
  }
  return `<div class="kpis">${cards}</div>${body}`;
}
function actRow(a,showProg=false) {
  const link = safeLink(a.link);
  let tools = "";
  if (!showProg && canAdd() && !S.demo) {
    tools = S.confirm===a.id
      ? `<button class="btn small danger solid" type="button" data-act="del-yes" data-id="${esc(a.id)}">تأكيد الحذف</button><button class="btn small" type="button" data-act="del-no">إلغاء</button>`
      : `<button class="btn small" type="button" data-act="edit" data-id="${esc(a.id)}">تعديل</button><button class="btn small danger" type="button" data-act="del" data-id="${esc(a.id)}">حذف</button>`;
  }
  return `<article class="act"><div>
    <h4>${esc(ROSTER.get(a.key)||a.teacher)}</h4>
    <div class="pills">${showProg?`<span class="pill">${PROGRAMS[a.program].name}</span>`:""}<span class="pill">${esc(a.track)}</span><span class="pill">${esc(a.type)}</span></div>

/* ---------- certificate: drawn on a canvas as a printable PNG ---------- */
function fitFont(ctx,text,weight,size,family,maxW) {
  let s = size;
  do { ctx.font = `${weight} ${s}px ${family}`; s -= 4; } while (ctx.measureText(text).width>maxW && s>24);
}
function wrapText(ctx,text,maxW) {
  const lines = []; let line = "";
  for (const w of text.split(" ")) { const n = line?line+" "+w:w; if (ctx.measureText(n).width>maxW && line) { lines.push(line); line = w; } else line = n; }
  if (line) lines.push(line);
  return lines;
}

function csvText(rows) {

}
function boardCsv() {
  return csvText([["المركز","المعلمة","قدرات","تحصيلي","ستيب","إجمالي المشاركات","الطالبات","الشواهد"],...currentBoard().map(t => [t.rank,t.name,t.p.qudrat,t.p.tahsili,t.p.step,t.count,t.students,t.evidence])]);
}
function logCsv() {
  return csvText([["البرنامج","التصنيف","نوع النشاط","اليوم","التاريخ الميلادي","التاريخ الهجري","المعلمة","عدد الطالبات","رابط الشواهد"],
    ...[...S.activities].sort((a,b) => b.date.localeCompare(a.date)).map(a => [PROGRAMS[a.program].name,a.track,a.type,weekday(a.date),a.date,hijriText(a.date),ROSTER.get(a.key)||a.teacher,a.students,safeLink(a.link)||""])]);
}
function honorMessage() {
  const med = ["🥇","🥈","🥉"];
  const top = currentBoard().slice(0,3).map(t => `${med[t.rank-1]} ${t.name}: ${shares(t.count)}`);
  return ["🏆 لوحة التكريم والشكر",scopeLabel(),"",...top,"","شكرًا لجهودكن وعطائكن."].join("\n");
}
function copyHonor() {
  const text = honorMessage();
  const fallback = () => { $("msgText").value = text; $("msgDlg").showModal(); $("msgText").select(); };
  if (!navigator.clipboard) return fallback();
  navigator.clipboard.writeText(text).then(() => toast("تم نسخ رسالة التكريم"),fallback);
}

function render() {
  if (S.demo && S.activities.length) S.demo = false;
  renderShell(); renderBanners();
  const active = document.activeElement && document.activeElement.id;
  const r = S.route, v = $("view");
  if (!S.loaded && !S.demo) v.innerHTML = loadingView();
  else if (r==="home") v.innerHTML = viewHome();
  else if (PROGRAMS[r]) v.innerHTML = viewProgram(r);
  else if (r==="analytics") v.innerHTML = viewAnalytics();
  else v.innerHTML = viewAwards();
  if (active && $(active) && document.activeElement !== $(active)) $(active).focus();
}
function go(route) {
  if (!ROUTES.some(x => x[0]===route)) route = "home";
  if (route!==S.route) { S.pTrack="all"; S.limit=30; S.confirm=null; }
  S.route = route;
  if ((location.hash||"").slice(1)!==route) { try { location.hash = route; } catch {} }
  render();
  const y = window.scrollY; if (y>200) window.scrollTo(0,0);
}

/* ---------- activity form ---------- */
function fillSelect(el,items,value) { el.innerHTML = items.map(([v,l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join(""); el.value = value; }
function syncOthers() {
  $("fTypeOther").hidden = $("fType").value!==OTHER;
  $("fTeacherOther").hidden = $("fTeacher").value!==OTHER;
}
function syncDate() {
  const v = $("fDate").value;
  $("fDateHint").textContent = validIso(v) ? `${weekday(v)} · ${hijriText(v)}` : "";
}
function openForm(prog,act) {
  S.demo = false; S.editing = act ? act.id : null; S.formProg = prog; render();
  const P = PROGRAMS[prog];
  $("formTitle").textContent = (act?"تعديل نشاط ":"إضافة نشاط ")+P.name;
  $("trackLegend").textContent = P.trackLabel==="النشاط"?"النشاط":P.trackLabel;
  $("trackRadios").innerHTML = P.tracks.map((t,i) => `<label><input type="radio" name="track" id="fTrack${i}" value="${esc(t)}"${act?(act.track===t?" checked":""):""}>${esc(t)}</label>`).join("");
  const isStdType = act && TYPES.includes(act.type);
  fillSelect($("fType"),[["","اختر نوع النشاط"],...TYPES.map(t => [t,t]),[OTHER,"أخرى"]], act?(isStdType?act.type:OTHER):"");
  $("fTypeOther").value = act&&!isStdType?act.type:"";
  const names = teacherOptions();
  const tName = act ? (ROSTER.get(act.key)||act.teacher) : "";
  fillSelect($("fTeacher"),[["","اختر المعلمة"],...names.map(n => [n,n]),[OTHER,"أخرى"]], tName);
  $("fTeacherOther").value = "";
  $("fDate").value = act?act.date:todayIso();
  $("fStudents").value = act?act.students:"";
  $("fLink").value = act?act.link:"";
  $("formErr").hidden = true; S.dupOk = null;
  syncOthers(); syncDate();
  $("formDlg").showModal();
}
function formError(msg,el) { const e = $("formErr"); e.textContent = msg; e.hidden = false; if (el) el.focus(); }
function normalizeLink(raw) {
  let u = raw.trim(); if (!u) return "";
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://"+u;
  return safeLink(u);
}
async function submitForm(ev) {
  ev.preventDefault();
  const P = PROGRAMS[S.formProg];
  const track = document.querySelector('input[name="track"]:checked');
  if (!track) return formError(`اختر ${P.trackLabel==="النشاط"?"النشاط: "+P.tracks.join(" أو "):P.trackLabel}.`);
  let type = $("fType").value;
  if (!type) return formError("اختر نوع النشاط.",$("fType"));
  if (type===OTHER) { type = $("fTypeOther").value.trim(); if (!type) return formError("اكتب نوع النشاط في خانة أخرى.",$("fTypeOther")); }
  const date = $("fDate").value;
  if (!validIso(date)) return formError("اختر تاريخ النشاط.",$("fDate"));
  if (!YEARS.includes(hijri(date).y)) return formError("يجب أن يقع التاريخ بين عامي 1447 و1450 هـ.",$("fDate"));
  let teacher = $("fTeacher").value;
  if (!teacher) return formError("اختر اسم المعلمة.",$("fTeacher"));
  if (teacher===OTHER) { teacher = $("fTeacherOther").value.trim().replace(/\s+/g," "); if (!teacher) return formError("اكتب اسم المعلمة في خانة أخرى.",$("fTeacherOther")); }
  teacher = ROSTER.get(nameKey(teacher)) || teacher;
  const stRaw = $("fStudents").value.trim();
  const students = Number(stRaw);
  if (stRaw==="" || !Number.isInteger(students) || students<0) return formError("اكتب عدد الطالبات رقمًا صحيحًا.",$("fStudents"));
  const link = normalizeLink($("fLink").value);
  if (link===null) return formError("رابط الشواهد غير صحيح. اكتب رابطًا يبدأ بـ https://",$("fLink"));
  const old = S.editing && S.activities.find(a => a.id===S.editing);
  const id = S.editing || newId();
  const doc = {program:S.formProg,track:track.value,type,date,teacher,students,link,createdAt:old?old.createdAt:Date.now()};
  const fresh = clean(id,doc), sig = [doc.program,doc.track,doc.type,doc.date,fresh.key].join("|");
  const dup = S.activities.some(a => a.id!==id && [a.program,a.track,a.type,a.date,a.key].join("|")===sig);
  if (dup && S.dupOk!==sig) { S.dupOk = sig; return formError("يوجد نشاط مطابق لهذه المعلمة في التاريخ نفسه. اضغط حفظ مرة أخرى إذا كان نشاطًا مختلفًا."); }
  const btn = $("saveBtn"); btn.disabled = true;
  try {
    await store.save(id,doc); $("formDlg").close();
    const after = board([...S.activities.filter(a => a.id!==id),fresh].filter(a => a.hy===fresh.hy)).find(t => t.key===fresh.key);
    toast(`تم الحفظ: ${after.name} في المركز ${after.rank} لعام ${fresh.hy} هـ`);
  }
  catch (e) { handleWriteError(e,formError); }
  finally { btn.disabled = false; }
}
function handleWriteError(e,show) {
  if (e && e.code==="invalid_argument") { show(e.detail==="too_many"?"امتلأت مساحة المنصة. احذف بعض الأنشطة القديمة ثم أعد المحاولة.":"تعذر الحفظ لأن إحدى الخانات غير صحيحة. راجع البيانات ثم أعد المحاولة."); return; }
  show("تعذر الحفظ. تحقق من الاتصال ثم أعد المحاولة.");
}
function openSettings() {
  const st = S.settings;
  $("sSchool").value = st.school||""; $("sPrincipal").value = st.principal||"";
  $("sStart").value = st.termStart||""; $("sWeeks").value = st.weeks||"";
  $("setErr").hidden = true;
  $("setDlg").showModal();
}
async function submitSettings(ev) {
  ev.preventDefault();
  const doc = {school:$("sSchool").value.trim(),principal:$("sPrincipal").value.trim(),termStart:$("sStart").value,weeks:Number($("sWeeks").value)||0};
  const show = m => { $("setErr").textContent = m; $("setErr").hidden = false; };
  try { await store.saveSettings(doc); S.settings = doc; renderShell(); $("setDlg").close(); toast("تم حفظ الإعدادات"); }
  catch (e) { handleWriteError(e,show); }
}
let toastT;
function toast(msg) { const t = $("toast"); t.firstElementChild.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; },2800); }

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const routeBtn = ev.target.closest("[data-route]");
  if (routeBtn) return go(routeBtn.dataset.route);
  const setBtn = ev.target.closest("[data-set]");
  if (setBtn) {
    const k = setBtn.dataset.set, v = setBtn.dataset.val;
    S[k] = v; S.limit = 30;
    if (k==="wYear" && v==="all") S.wMonth = "all";
    return render();
  }
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act==="add") openForm(b.dataset.prog);
  else if (act==="close-form") $("formDlg").close();
  else if (act==="close-settings") $("setDlg").close();
  else if (act==="settings") openSettings();
  else if (act==="teacher") openTeacher(b.dataset.key);
  else if (act==="close-teacher") $("teacherDlg").close();
  else if (act==="cert") openCert(b.dataset.key);
  else if (act==="close-cert") $("certDlg").close();
  else if (act==="close-msg") $("msgDlg").close();
  else if (act==="cert-save" && S.cert) S.cert.canvas.toBlob(bl => saveFile(`شهادة شكر - ${S.cert.name}.png`,bl),"image/png");
  else if (act==="copy-msg") copyHonor();
  else if (act==="csv-board") saveFile("ترتيب المعلمات.csv",boardCsv());
  else if (act==="csv-log") saveFile("سجل الأنشطة.csv",logCsv());
  else if (act==="star") { const n = hijri(todayIso()); S.wYear = n.y; S.wMonth = n.m; S.wProg = "all"; render(); }
  else if (act==="demo-on") { S.demo = true; render(); }
  else if (act==="demo-off") { S.demo = false; render(); }
  else if (act==="more") { S.limit += 30; render(); }
  else if (act==="see-awards") { S.wProg = b.dataset.prog; go("awards"); }
  else if (act==="edit") { const a = S.activities.find(x => x.id===id); if (a) openForm(a.program,a); }
  else if (act==="del") { S.confirm = id; render(); }
  else if (act==="del-no") { S.confirm = null; render(); }
  else if (act==="del-yes") {
    try { await store.remove(id); S.confirm = null; render(); toast("تم حذف النشاط وتحديث المراكز"); }
    catch (e) { handleWriteError(e,toast); }
  }
});
document.addEventListener("change",ev => {
  const el = ev.target;
  if (el.dataset.sel) { S[el.dataset.sel] = el.value; render(); }
  else if (el.dataset.check) { S[el.dataset.check] = el.checked; render(); }
});
$("actForm").addEventListener("submit",submitForm);
$("setForm").addEventListener("submit",submitSettings);
$("fType").addEventListener("change",() => { syncOthers(); if ($("fType").value===OTHER) $("fTypeOther").focus(); });
$("fTeacher").addEventListener("change",() => { syncOthers(); if ($("fTeacher").value===OTHER) $("fTeacherOther").focus(); });
$("fDate").addEventListener("input",syncDate);
window.addEventListener("hashchange",() => { const h = location.hash.slice(1); if (h && h!==S.route) go(h); });
document.addEventListener("pointerover",ev => {
  const t = ev.target.closest && ev.target.closest("[data-tip]"), tip = $("tip");
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const r = t.getBoundingClientRect(), w = tip.offsetWidth;
  tip.style.left = Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+"px";
  tip.style.top = Math.max(8,r.top-tip.offsetHeight-6)+"px";
});
const startHash = location.hash.slice(1);
if (ROUTES.some(x => x[0]===startHash)) S.route = startHash;
init();
</script>
</body>
